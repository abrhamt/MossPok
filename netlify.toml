[build]
  base = "client/"
  publish = "build/"
  command = "npm install --legacy-peer-deps && NODE_OPTIONS=--openssl-legacy-provider CI=false npm run build"

[[redirects]]
  from = "/api/*"
  to = "https://mosspok-backend.onrender.com/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200